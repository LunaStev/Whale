[workspace]
members = [
    "diagnostic",
    "assembler",
    "assembler/amd64",
    "backend-api",
    "toolchain",
    "examples/external-target",
    "reverse",
    "target-spec",
    "object",
    "linker", "ir",
]

[workspace.package]
rust-version = "1.86"

[package]
name = "whale"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[features]
default = []
socket-cli = ["ir/socket"]
wave-reverse = ["reverse/wave"]

[dependencies]
assembler = { path = "assembler" }
amd64 = { path = "assembler/amd64" }
toolchain = { path = "toolchain" }
reverse = { path = "reverse" }
linker = { path = "linker" }
object = { path = "object" }
ir = { path = "ir", version = "0.1.0", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
same-file = "1"
tempfile = "3"
