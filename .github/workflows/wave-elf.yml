name: Wave ELF bootstrap

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-elf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-elf:
    name: Wave ELF / Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavefnd/Wave
          ref: 8a465e30aeea4b817d925cdd0e8d08c1bb029c9a
          path: .wave-bootstrap
          persist-credentials: false
      - name: Install bootstrap dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget software-properties-common
          wget --tries=3 --timeout=30 https://apt.llvm.org/llvm.sh -O "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 21
          sudo apt-get install -y lld-21
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=/usr/lib/llvm-21/bin/llvm-config" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal --component clippy
      - name: Build pinned Wave compiler and records
        run: python3 tools/build_wave_elf.py --wave-source .wave-bootstrap --out-dir "$RUNNER_TEMP/wave-elf"
      - name: Verify Wave path and independent Rust serialization
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          export WHALE_WAVE_ELF_DIR="$RUNNER_TEMP/wave-elf"
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-features --locked
          python3 tools/ci_smoke.py --binary target/debug/whale --socket enabled
