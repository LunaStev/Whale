name: Wave reverse bootstrap

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-reverse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-reverse:
    name: Wave decoder and CFG / Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wavefnd/Wave
          ref: e0952ed65d07e14c6ed0aa64f3c9a5532dd7533b
          path: .wave-reverse-bootstrap
          persist-credentials: false
      - name: Install pinned compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y wget software-properties-common
          wget --tries=3 --timeout=30 https://apt.llvm.org/llvm.sh -O "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 21
          sudo apt-get install -y lld-21
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=/usr/lib/llvm-21/bin/llvm-config" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.89.0 --profile minimal
          rustup toolchain install stable --profile minimal --component clippy
      - name: Test archive publication and fingerprint rejection
        run: python3 -m unittest discover -s tools -p test_build_wave_reverse.py -v
      - name: Build official pinned Wave decoder and CFG
        run: |
          python3 tools/build_wave_reverse.py --wave-source .wave-reverse-bootstrap \
            --out-dir "$RUNNER_TEMP/wave-reverse" --rust-toolchain 1.89.0 --allow-network
          echo "WHALE_WAVE_REVERSE_DIR=$RUNNER_TEMP/wave-reverse" >> "$GITHUB_ENV"
      - name: Verify linked workspace and CLI
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-features --locked
      - name: Probe actual Wave decoding and CFG under resource limits
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo test -p reverse --example fuzz_reverse --features wave --locked
          cargo build -p reverse --example fuzz_reverse --features wave --locked
          timeout 300s python3 tools/fuzz_limits.py --memory-mib 512 -- \
            target/debug/examples/fuzz_reverse --seed 6289366696573784625 --cases 10000 \
            --out-dir "$RUNNER_TEMP/reverse-fuzz"
      - name: Preserve native replay inputs on failure
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/reverse-fuzz" ]; then
            find "$RUNNER_TEMP/reverse-fuzz" -maxdepth 1 -type f -print -exec od -An -v -tx1 {} \;
          fi
      - name: Retain provenance and exact replay inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave-reverse-provenance-and-replays
          path: |
            ${{ runner.temp }}/wave-reverse/provenance.json
            ${{ runner.temp }}/wave-reverse/reverse-core.meta
            ${{ runner.temp }}/reverse-fuzz/
          if-no-files-found: warn
          retention-days: 7
